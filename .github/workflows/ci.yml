name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full quality gate (docs/rust-quality.md) runs once, on macOS: formatting, lints inheritance, cargo-deny for
  # every target, cargo-audit, cargo-machete, clippy, and the tests.
  gate:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          key: ci-macos

      # crates/core/build.rs compiles proto/googlechat.proto with prost-build, which needs protoc.
      - name: Install protoc
        run: brew install protobuf

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-audit,cargo-machete

      - name: Quality gate
        run: just check

  # The code behind cfg(target_os = "linux") only compiles here: clippy and the tests.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          key: ci-linux

      # GPUI, wry (WebKitGTK), the D-Bus notifications, and protoc for crates/core/build.rs.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libfontconfig-dev libasound2-dev libvulkan-dev libdbus-1-dev protobuf-compiler clang \
            pkg-config

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          TZ: UTC
        run: cargo nextest run --workspace --no-tests=pass

  # The code behind cfg(target_os = "windows") only compiles here: clippy and the tests.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          key: ci-windows

      - name: Install protoc
        run: choco install protoc --no-progress -y

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          TZ: UTC
        run: cargo nextest run --workspace --no-tests=pass
