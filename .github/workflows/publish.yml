name: Publish Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, whatever the tag: a newer tag cancels the run still building an older one.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  # macOS: each architecture builds on its own runner at the same time; the release job joins them.
  build:
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # A failed or cancelled release still keeps the compiled dependencies for the next one.
          cache-on-failure: true

      # crates/core/build.rs compiles proto/googlechat.proto with prost-build, which needs protoc.
      - name: Install protoc
        run: brew install protobuf

      # WORKING_UPDATES turns the self-updater on; only release builds have it.
      - name: Build
        env:
          WORKING_UPDATES: "1"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --locked -p working --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: working-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/working
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    # Xcode 26+ compiles the Icon Composer document (logo/Working.icon).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: working-*-apple-darwin
          path: target/bin

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-packager
        id: cache-packager
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.cache-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG#v}" != "${VERSION}" ]]; then
              echo "tag does not match Cargo.toml version" >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "TAG=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Import Apple Developer Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify codesigning identity
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_SIGNING_IDENTITY}" ]] || \
            ! security find-identity -p codesigning -v 2>/dev/null | grep -F -q -- "${APPLE_SIGNING_IDENTITY}"; then
            echo "codesigning identity not found" >&2
            exit 1
          fi

      - name: Write Apple API key for notarization
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_CONTENT}" ]]; then
            echo "APPLE_API_KEY or APPLE_API_KEY_CONTENT is empty" >&2
            exit 1
          fi
          key_dir="${HOME}/private_keys"
          mkdir -p "$key_dir"
          umask 077
          key_path="${key_dir}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: Join, sign, and notarize
        env:
          WORKING_ARM64_BINARY: target/bin/working-aarch64-apple-darwin/working
          WORKING_X86_64_BINARY: target/bin/working-x86_64-apple-darwin/working
          WORKING_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: target/dist/*
          if-no-files-found: error
          retention-days: 1

  # The AppImage, built on each architecture's own runner by scripts/package-linux.sh. GTK 3, WebKitGTK 4.1, and
  # libsoup 3 stay system libraries, so the runner's Ubuntu sets the oldest glibc the AppImage runs on.
  linux:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
          cache-on-failure: true

      # GPUI, wry (WebKitGTK), the D-Bus notifications, and protoc for crates/core/build.rs; desktop-file-utils lets
      # the script validate working.desktop.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libfontconfig-dev libasound2-dev libvulkan-dev libdbus-1-dev protobuf-compiler clang \
            pkg-config desktop-file-utils

      - name: Cache cargo-packager
        id: cache-packager
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.cache-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build and sign the AppImage
        env:
          WORKING_UPDATES: "1"
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            target/dist/Working_*_${{ matrix.arch }}.AppImage
            target/dist/Working_*_${{ matrix.arch }}.AppImage.sig
          if-no-files-found: error
          retention-days: 1

  # The per-user NSIS installer, built on each architecture's own runner by scripts/package-windows.ps1. It is not
  # Authenticode-signed; the minisign .sig is for the updater.
  windows:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
          cache-on-failure: true

      # crates/core/build.rs compiles proto/googlechat.proto with prost-build, which needs protoc.
      - name: Install protoc
        run: choco install protoc --no-progress -y

      # ring compiles C with clang on arm64; the image puts LLVM's bin folder on PATH.
      - name: Check clang
        if: matrix.arch == 'arm64'
        run: clang --version

      - name: Cache cargo-packager
        id: cache-packager
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.cache-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build and sign the installer
        shell: pwsh
        env:
          WORKING_UPDATES: "1"
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: |
            target/dist/Working_*_${{ matrix.arch }}-setup.exe
            target/dist/Working_*_${{ matrix.arch }}-setup.exe.sig
          if-no-files-found: error
          retention-days: 1

  # Notes, the release, and its files are made on Linux, apart from the signing keychain. A stable tag is published
  # as the latest release; a tag with a "-" (v0.0.7-rc1) stays a draft prerelease to test by hand.
  publish:
    needs: [release, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      # Full history and tags: the notes span the commits since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          STABLE=true
          [[ "$TAG" == *-* ]] && STABLE=false
          {
            echo "VERSION=${VERSION}"
            echo "TAG=${TAG}"
            echo "STABLE=${STABLE}"
          } >> "$GITHUB_ENV"
          {
            echo "tag=${TAG}"
            echo "stable=${STABLE}"
          } >> "$GITHUB_OUTPUT"

      # Every platform the updater serves, with the minisign signature of the file it downloads. A missing file or
      # an empty signature fails the release.
      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          dist = Path("dist")
          # cargo-packager-updater keys are {os}-{arch}; the universal macOS bundle serves both Mac architectures.
          files = {
              "macos-aarch64": (f"Working_{version}_universal.app.tar.gz", "app"),
              "macos-x86_64": (f"Working_{version}_universal.app.tar.gz", "app"),
              "linux-x86_64": (f"Working_{version}_x86_64.AppImage", "appimage"),
              "linux-aarch64": (f"Working_{version}_aarch64.AppImage", "appimage"),
              "windows-x86_64": (f"Working_{version}_x64-setup.exe", "nsis"),
              "windows-aarch64": (f"Working_{version}_arm64-setup.exe", "nsis"),
          }
          platforms = {}
          for key, (name, kind) in files.items():
              if not (dist / name).is_file():
                  raise SystemExit(f"{key}: {name} is missing")
              sig = dist / f"{name}.sig"
              signature = sig.read_text().strip() if sig.is_file() else ""
              if not signature:
                  raise SystemExit(f"{key}: {sig.name} is missing or empty")
              platforms[key] = {
                  "signature": signature,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "format": kind,
              }
          manifest = {
              "version": version,
              "notes": "",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          (dist / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Write release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The latest published release, so tags that never shipped are covered by this one.
          previous="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          [[ "$previous" == "$TAG" ]] && previous=""
          python3 scripts/release_notes.py "$TAG" "$previous" > notes.md
          cat notes.md

      - name: Create and publish the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "release ${TAG} is published; refusing to replace assets in place" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            [[ "$STABLE" == "true" ]] || prerelease=(--prerelease)
            # A draft first, so the release is never public without its files.
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              "${prerelease[@]}" \
              --title "Working ${TAG}" \
              --notes-file notes.md
          fi
          if [[ "$STABLE" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "published ${TAG}"
          else
            echo "draft prerelease ${TAG}"
          fi

  # The Homebrew cask, for stable releases. A release published by this workflow's token does not trigger
  # homebrew.yml's own events, so the same run calls it.
  homebrew:
    needs: publish
    if: needs.publish.outputs.stable == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
